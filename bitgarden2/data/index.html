<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비트가든 · 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --bg:#10140D; --panel:#161C12; --panel-2:#1C231A; --line:#2B3325;
    --soil:#5C4830; --soil-light:#7A5F3F; --moss:#93A583; --text:#EDE9DC;
    --text-dim:#9AA08D; --bloom:#E2795A; --bloom-dim:#6B4A3C; --gold:#CDA55C; --danger:#C4574A;
    --btc:#CDA55C; --eth:#8FA9C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; color:var(--text); padding:32px 24px 70px; font-size:16px;}
  .wrap{max-width:1120px; margin:0 auto;}

  .head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:26px; gap:16px; flex-wrap:wrap;}
  .head h1{font-family:'Newsreader',serif; font-weight:500; font-size:38px; margin:0 0 6px;}
  .head .sub{color:var(--text-dim); font-size:15px;}
  .datepick{display:flex; align-items:center; gap:10px;}
  .datepick input{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:3px; font-family:inherit; font-size:16px;}
  .datepick button{background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:9px 13px; border-radius:3px; cursor:pointer; font-family:inherit; font-size:15px;}
  .datepick button:hover{border-color:var(--moss); color:var(--moss);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:24px; margin-bottom:24px;}
  .panel h2{font-size:15px; color:var(--text-dim); margin:0 0 18px; font-weight:600;}
  .panel h2 .tag{color:var(--text-dim); font-weight:400; font-size:13px;}

  /* 누적 현황 + 마일스톤 */
  .cum-wrap{display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;}
  .cum-hero{min-width:160px;}
  .cum-hero .v{font-family:'Newsreader',serif; font-size:34px;}
  .cum-hero .l{color:var(--text-dim); font-size:13.5px; margin-top:6px;}
  .ms-list{flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:12px; min-width:280px;}
  @media (max-width:760px){ .ms-list{grid-template-columns:repeat(2,1fr);} }
  .ms-item{border:1px solid var(--line); border-radius:4px; padding:12px 10px; background:var(--panel-2);}
  .ms-item.done{border-color:var(--moss);}
  .ms-item .ms-amt{font-family:'Newsreader',serif; font-size:17px;}
  .ms-item.done .ms-amt{color:var(--moss);}
  .ms-item .ms-date{font-size:12px; color:var(--text-dim); margin-top:5px;}
  .ms-item.done .ms-date{color:var(--gold);}
  .ms-bar{height:4px; background:var(--panel); border-radius:2px; margin-top:8px; overflow:hidden;}
  .ms-bar-fill{height:100%; background:var(--bloom);}

  /* daily table */
  table{width:100%; border-collapse:collapse; font-size:16px;}
  th{text-align:right; color:var(--text-dim); font-weight:500; font-size:14px; padding:0 12px 12px 0; border-bottom:1px solid var(--line);}
  th:first-child, td:first-child{text-align:left;}
  td{padding:14px 12px 14px 0; border-bottom:1px solid var(--line); text-align:right; font-family:'Newsreader',serif; font-size:19px;}
  tr:last-child td{border-bottom:none;}
  tr.total td{font-weight:600;}
  .coin-label{font-family:'Pretendard',sans-serif; font-size:16px; display:flex; align-items:center; gap:8px;}
  .swatch{width:9px; height:9px; border-radius:2px; display:inline-block;}
  .pos{color:var(--moss);} .neg{color:var(--danger);}

  /* chart */
  .chart-legend{display:flex; gap:20px; margin-bottom:12px; font-size:14px; color:var(--text-dim);}
  .chart-legend span{display:inline-flex; align-items:center; gap:7px;}
  .line-sw{width:14px; height:2px; display:inline-block; border-radius:1px;}
  svg text{font-family:'Pretendard',sans-serif; fill:var(--text-dim); font-size:12px;}

  .empty{color:var(--text-dim); font-size:15px; padding:6px 0;}
  .footnote{color:var(--text-dim); font-size:13.5px; margin-top:12px; line-height:1.6;}
  .status-msg{color:var(--text-dim); font-size:15px; text-align:center; padding:40px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>비트가든 · 대시보드</h1>
      <div class="sub">시드 · 블룸 · 저수지 — state.json 기반</div>
    </div>
    <div class="datepick">
      <button id="prevDay">◀</button>
      <input type="date" id="datePick">
      <button id="nextDay">▶</button>
      <button id="todayBtn">오늘</button>
    </div>
  </div>

  <div id="statusMsg" class="status-msg">데이터를 불러오는 중...</div>

  <div id="content" style="display:none;">

    <div class="panel">
      <h2>일별 요약 <span class="tag" id="tableDateLabel"></span></h2>
      <table>
        <thead>
          <tr><th>코인</th><th>매수</th><th>매도</th><th>수익</th><th>활성 시드</th></tr>
        </thead>
        <tbody id="dailyTableBody"></tbody>
      </table>
      <div class="footnote" id="dailyFootnote"></div>
    </div>

    <div class="panel">
      <h2>최근 30일 손익 추이</h2>
      <div class="chart-legend">
        <span><span class="line-sw" style="background:var(--text);"></span>전체</span>
        <span><span class="line-sw" style="background:var(--btc);"></span>비트코인</span>
        <span><span class="line-sw" style="background:var(--eth);"></span>이더리움</span>
      </div>
      <svg id="lineChart" viewBox="0 0 960 260" style="width:100%; height:auto;"></svg>
    </div>

    <div class="panel">
      <h2>누적 현황</h2>
      <div class="cum-wrap">
        <div class="cum-hero">
          <div class="v" id="cumProfit">-</div>
          <div class="l">누적 수익</div>
        </div>
        <div class="ms-list" id="milestoneList"></div>
      </div>
    </div>

  </div>
</div>

<script>
/* ====== 데이터 경로 설정 ======
   GitHub Pages에 이 index.html과 함께 state.json 을 같은 위치(또는 아래 경로)에 두면 자동으로 fetch합니다.
   다른 저장소/경로에 둘 경우 아래 DATA_BASE만 수정하세요. (해당 리포는 공개 상태여야 브라우저에서 접근 가능)

   적립금/분배금 필드명 설정:
   state.json의 bloom(체결완료) 항목에 적립금/분배금을 나중에 추가하실 때, 아래 두 상수를
   실제로 쓰는 필드명과 맞춰주세요. 이 필드가 없는(과거) 데이터는 자동으로
   적립금 0 / 분배금 = profit 전액으로 처리됩니다.
*/
const DATA_BASE = './';
const FIELD_RESERVOIR = 'reservoir_amount';   // 적립금 필드명
const FIELD_DISTRIBUTED = 'distributed_amount'; // 분배금 필드명

let STATE = [];

function toDateStr(iso){ return iso.slice(0,10); }
function won(n){ return '₩' + Math.round(n).toLocaleString('ko-KR'); }

function getReservoir(e){
  return (e[FIELD_RESERVOIR] != null) ? e[FIELD_RESERVOIR] : 0;
}
function getDistributed(e){
  return (e[FIELD_DISTRIBUTED] != null) ? e[FIELD_DISTRIBUTED] : (e.profit || 0);
}

async function loadData(){
  const res = await fetch(DATA_BASE + 'state.json');
  if(!res.ok) throw new Error('state.json 로드 실패');
  STATE = await res.json();
}

function renderCumulative(){
  const blooms = STATE
    .filter(e => e.status === 'bloomed')
    .slice()
    .sort((a,b) => a.bloom_time < b.bloom_time ? -1 : (a.bloom_time > b.bloom_time ? 1 : 0));

  const MILESTONE_STEP = 50000;
  const MILESTONE_COUNT = 10;
  const targets = Array.from({length: MILESTONE_COUNT}, (_,i) => (i+1)*MILESTONE_STEP);

  let running = 0, ti = 0;
  const results = [];
  for(const e of blooms){
    running += (e.profit || 0);
    while(ti < targets.length && running >= targets[ti]){
      results.push({ amount: targets[ti], date: toDateStr(e.bloom_time) });
      ti++;
    }
  }
  while(ti < targets.length){
    results.push({ amount: targets[ti], date: null });
    ti++;
  }

  document.getElementById('cumProfit').textContent = won(running);

  const list = document.getElementById('milestoneList');
  list.innerHTML = results.map(r=>{
    if(r.date){
      return `<div class="ms-item done">
        <div class="ms-amt">${won(r.amount)}</div>
        <div class="ms-date">${r.date} 달성</div>
      </div>`;
    }
    const pct = Math.max(0, Math.min(100, (running / r.amount) * 100));
    return `<div class="ms-item">
      <div class="ms-amt">${won(r.amount)}</div>
      <div class="ms-date">미달성</div>
      <div class="ms-bar"><div class="ms-bar-fill" style="width:${pct.toFixed(1)}%;"></div></div>
    </div>`;
  }).join('');
}

function activeAsOfDate(coin, dateStr){
  let seeds = 0, blooms = 0;
  for(const e of STATE){
    if(e.coin !== coin) continue;
    if(toDateStr(e.seed_time) <= dateStr) seeds++;
    if(e.status === 'bloomed' && toDateStr(e.bloom_time) <= dateStr) blooms++;
  }
  return seeds - blooms;
}

function dailyStats(coin, dateStr){
  let seedCount = 0, bloomCount = 0, profit = 0, reservoir = 0, distributed = 0;
  for(const e of STATE){
    if(coin !== 'ALL' && e.coin !== coin) continue;
    if(toDateStr(e.seed_time) === dateStr) seedCount++;
    if(e.status === 'bloomed' && toDateStr(e.bloom_time) === dateStr){
      bloomCount++;
      profit += (e.profit || 0);
      reservoir += getReservoir(e);
      distributed += getDistributed(e);
    }
  }
  return { seedCount, bloomCount, profit, reservoir, distributed };
}

function renderDailyTable(dateStr){
  const rows = [
    { key:'ALL', label:'전체', sw:'var(--text)' },
    { key:'BTC', label:'비트코인', sw:'var(--btc)' },
    { key:'ETH', label:'이더리움', sw:'var(--eth)' }
  ];
  const body = document.getElementById('dailyTableBody');
  body.innerHTML = rows.map(r=>{
    const s = dailyStats(r.key, dateStr);
    const active = r.key === 'ALL'
      ? Math.max(0,activeAsOfDate('BTC',dateStr)) + Math.max(0,activeAsOfDate('ETH',dateStr))
      : Math.max(0, activeAsOfDate(r.key, dateStr));
    return `<tr class="${r.key==='ALL'?'total':''}">
      <td class="coin-label"><span class="swatch" style="background:${r.sw};"></span>${r.label}</td>
      <td>${s.seedCount}</td>
      <td>${s.bloomCount}</td>
      <td class="${s.profit>=0?'pos':'neg'}">${won(s.profit)}</td>
      <td>${active}</td>
    </tr>`;
  }).join('');
  document.getElementById('tableDateLabel').textContent = dateStr;
  document.getElementById('dailyFootnote').textContent = '활성 시드는 선택한 날짜까지의 누적 기준입니다.';
}

function last30Dates(endDateStr){
  const end = new Date(endDateStr+'T00:00:00');
  const dates = [];
  for(let i=29;i>=0;i--){
    const d = new Date(end);
    d.setDate(d.getDate()-i);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}

function renderChart(endDateStr){
  const dates = last30Dates(endDateStr);
  const perDate = {};
  dates.forEach(d=> perDate[d] = { ALL:0, BTC:0, ETH:0 });
  for(const e of STATE){
    if(e.status !== 'bloomed') continue;
    const d = toDateStr(e.bloom_time);
    if(!perDate[d]) continue;
    perDate[d].ALL += (e.profit||0);
    if(e.coin==='BTC') perDate[d].BTC += (e.profit||0);
    if(e.coin==='ETH') perDate[d].ETH += (e.profit||0);
  }
  const series = { ALL: dates.map(d=>perDate[d].ALL), BTC: dates.map(d=>perDate[d].BTC), ETH: dates.map(d=>perDate[d].ETH) };
  const allVals = [...series.ALL, ...series.BTC, ...series.ETH];
  let min = Math.min(0, ...allVals), max = Math.max(0, ...allVals);
  if(min===max){ min-=1; max+=1; }
  const W=960, H=260, padL=60, padR=10, padT=14, padB=30;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (i/(dates.length-1))*innerW;
  const y = v => padT + innerH - ((v-min)/(max-min))*innerH;

  function path(vals){
    return vals.map((v,i)=> (i===0?'M':'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  }

  const zeroY = y(0);
  const gridLines = 4;
  let gridSvg = '';
  for(let g=0; g<=gridLines; g++){
    const v = min + (max-min)*(g/gridLines);
    const gy = y(v);
    gridSvg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${(gy+4).toFixed(1)}" font-size="12" text-anchor="end">${Math.round(v).toLocaleString('ko-KR')}</text>`;
  }
  let dateSvg = '';
  const step = Math.ceil(dates.length/6);
  dates.forEach((d,i)=>{
    if(i % step === 0 || i===dates.length-1){
      dateSvg += `<text x="${x(i).toFixed(1)}" y="${H-6}" font-size="12" text-anchor="middle">${d.slice(5)}</text>`;
    }
  });

  const svg = document.getElementById('lineChart');
  svg.innerHTML = `
    ${gridSvg}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="${path(series.BTC)}" fill="none" stroke="var(--btc)" stroke-width="1.6"/>
    <path d="${path(series.ETH)}" fill="none" stroke="var(--eth)" stroke-width="1.6"/>
    <path d="${path(series.ALL)}" fill="none" stroke="var(--text)" stroke-width="2"/>
    ${dateSvg}
  `;
}

function renderAll(dateStr){
  renderDailyTable(dateStr);
  renderChart(dateStr);
}

function init(){
  const todayStr = new Date().toISOString().slice(0,10);
  const picker = document.getElementById('datePick');
  picker.value = todayStr;
  picker.max = todayStr;

  document.getElementById('statusMsg').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  renderCumulative();
  renderAll(todayStr);

  picker.addEventListener('change', ()=> renderAll(picker.value));
  document.getElementById('todayBtn').addEventListener('click', ()=>{ picker.value = todayStr; renderAll(todayStr); });
  document.getElementById('prevDay').addEventListener('click', ()=>{
    const d = new Date(picker.value+'T00:00:00'); d.setDate(d.getDate()-1);
    picker.value = d.toISOString().slice(0,10); renderAll(picker.value);
  });
  document.getElementById('nextDay').addEventListener('click', ()=>{
    const d = new Date(picker.value+'T00:00:00'); d.setDate(d.getDate()+1);
    if(d.toISOString().slice(0,10) > todayStr) return;
    picker.value = d.toISOString().slice(0,10); renderAll(picker.value);
  });
}

loadData().then(init).catch(err=>{
  document.getElementById('statusMsg').textContent =
    'data 로드 실패: ' + err.message + ' — state.json 이 이 페이지와 같은 경로에 있는지 확인하세요.';
});
</script>
</body>
</html>
